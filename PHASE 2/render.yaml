services:
  - type: web
    name: short-interest-prediction-api
    env: python
    rootDir: PHASE 2
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.app:app --host 0.0.0.0 --port $PORT
    plan: starter
    disk:
      name: persistent-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/notifications.db
      - key: CORS_ORIGINS
        value: "*"
      - key: SEC_USER_AGENT
        value: ShortInterestResearchPlatform contact@domain.com
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_GEMINI_CLASSIFIER
        value: "true"

